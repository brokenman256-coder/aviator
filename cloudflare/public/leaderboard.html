<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leaderboard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon"><svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M2 12L22 2L14 22L11 13L2 12Z"/></svg></span>
        <span class="brand-name">LEADERS</span>
      </div>
      <div class="topbar-right">
        <span id="usernamePill" class="username-pill"></span>
        <a class="ghost-btn" href="index.html">Back to game</a>
        <button id="logoutBtn" class="ghost-btn">Log out</button>
      </div>
    </header>

    <section class="feed-panel">
      <div class="feed-tabs">
        <button class="lb-tab active" data-metric="net">Top Profit</button>
        <button class="lb-tab" data-metric="wagered">Most Wagered</button>
        <button class="lb-tab" data-metric="biggest">Biggest Win</button>
      </div>
      <div id="lbList" class="lb-list"></div>
    </section>
  </div>

  <script src="js/leaderboard.js"></script>
</body>
</html>
