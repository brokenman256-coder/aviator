<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aviator — Sign in</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="brand" style="justify-content:center;">
      <span class="brand-icon"><svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M2 12L22 2L14 22L11 13L2 12Z"/></svg></span>
      <span class="brand-name">AVIATOR</span>
    </div>

    <div class="auth-card" id="credentialsCard">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <div class="error-box hidden" id="errorBox"></div>

      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="loginEmail" required autocomplete="email" />
        </div>
        <div class="field" style="margin-top:10px;">
          <label>Password</label>
          <input type="password" id="loginPassword" required autocomplete="current-password" />
        </div>
        <button type="submit" class="primary-btn" style="margin-top:14px; width:100%;">Log In</button>
      </form>

      <form id="registerForm" class="section-hidden">
        <div class="info-box hidden" id="referralNote" style="margin-bottom:10px;"></div>
        <div class="field">
          <label>Username</label>
          <input type="text" id="registerUsername" required minlength="3" maxlength="20" />
        </div>
        <div class="field" style="margin-top:10px;">
          <label>Email</label>
          <input type="email" id="registerEmail" required autocomplete="email" />
        </div>
        <div class="field" style="margin-top:10px;">
          <label>Phone number</label>
          <input type="tel" id="registerPhone" required pattern="[0-9]{7,15}" autocomplete="tel" placeholder="Digits only" />
        </div>
        <div class="field" style="margin-top:10px;">
          <label>Password</label>
          <input type="password" id="registerPassword" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="primary-btn" style="margin-top:14px; width:100%;">Create Account</button>
      </form>
    </div>

    <div class="auth-card section-hidden" id="otpCard">
      <div style="font-weight:700;">Verify your account</div>
      <div class="info-box" id="otpInfo"></div>
      <div class="field">
        <label>6-digit code</label>
        <input type="text" id="otpCode" class="otp-input" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
      </div>
      <button id="verifyBtn" class="primary-btn">Verify &amp; Continue</button>
      <button id="resendBtn" class="link-btn">Resend code</button>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
