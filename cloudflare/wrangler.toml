name = "aviator"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "GAME_ROOM"
