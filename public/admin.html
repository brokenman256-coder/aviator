<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aviator — Admin</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .payment-request { border:1px solid #444; padding:15px; margin:10px 0; border-radius:8px; }
  .qr-upload { text-align:center; padding:20px; background:#1a1a1a; border-radius:12px; }
</style>
</head>
<body>
  <div class="app wide">
    <header class="topbar">
      <div class="brand"><span class="brand-name">🚀 ADMIN DASHBOARD</span></div>
      <div class="topbar-right">
        <span id="usernamePill"></span>
        <a href="index.html" class="ghost-btn">Game</a>
        <button id="logoutBtn" class="ghost-btn">Logout</button>
      </div>
    </header>

    <div id="adminContent">
      <!-- Original Stats -->
      <div class="admin-grid">
        <div class="stat-card"><div class="stat-label">Users</div><div class="stat-value" id="statUsers">—</div></div>
        <div class="stat-card"><div class="stat-label">Rounds</div><div class="stat-value" id="statRounds">—</div></div>
        <div class="stat-card"><div class="stat-label">Wagered</div><div class="stat-value" id="statWagered">—</div></div>
        <div class="stat-card"><div class="stat-label">Paid Out</div><div class="stat-value" id="statPaidOut">—</div></div>
        <div class="stat-card"><div class="stat-label">Profit</div><div class="stat-value" id="statProfit">—</div></div>
      </div>

      <!-- New: Deposit QR Upload -->
      <div class="panel qr-upload">
        <h2>Upload Deposit QR Code</h2>
        <input type="file" id="qrUpload" accept="image/*">
        <button id="uploadQRBtn">Upload QR</button>
        <div id="currentQRPreview"></div>
      </div>

      <!-- New: Payment Requests -->
      <div class="panel">
        <h2>Pending Payment Requests</h2>
        <div id="paymentRequests"></div>
      </div>

      <!-- Original Settings -->
      <div class="panel">
        <h2>Game Settings</h2>
        <div class="settings-grid">
          <div class="field"><label>House edge (%)</label><input type="number" id="settingHouseEdge" step="0.1"></div>
          <div class="field"><label>Signup bonus</label><input type="number" id="settingBonus"></div>
          <div class="field"><label>Min Bet</label><input type="number" id="settingMinBet"></div>
          <div class="field"><label>Max Bet</label><input type="number" id="settingMaxBet"></div>
        </div>
        <button id="saveSettingsBtn">Save Settings</button>
      </div>

      <!-- Original Users Table -->
      <div class="panel">
        <h2>Users</h2>
        <div class="table-wrap">
          <table><thead><tr><th>ID</th><th>Username</th><th>Balance</th><th>Actions</th></tr></thead><tbody id="usersTableBody"></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
