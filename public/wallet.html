<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aviator — Wallet</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .payment-box { background:#1f1f1f; padding:20px; border-radius:12px; margin:15px 0; text-align:center; }
  .qr-img { max-width:280px; border:3px solid gold; border-radius:10px; margin:10px 0; }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-name">💰 WALLET</span></div>
      <div class="topbar-right">
        <span id="usernamePill"></span>
        <a href="index.html" class="ghost-btn">Game</a>
        <button id="logoutBtn" class="ghost-btn">Logout</button>
      </div>
    </header>

    <div class="panel">
      <h2>Balance: <span id="walletBalance" style="color:#ffd700;">0.00</span></h2>
    </div>

    <!-- Deposit -->
    <div class="panel payment-box">
      <h2>Deposit Funds</h2>
      <p>Scan this QR to add credits</p>
      <div id="depositQRContainer">
        <img id="depositQR" class="qr-img" alt="Deposit QR" style="display:none;">
        <p id="noQR">Admin QR coming soon...</p>
      </div>
    </div>

    <!-- Withdraw -->
    <div class="panel payment-box">
      <h2>Request Withdrawal</h2>
      <input type="number" id="withdrawAmount" placeholder="Amount" value="100" style="width:100%; padding:12px; margin:10px 0;">
      <input type="text" id="withdrawUPI" placeholder="Your UPI ID" style="width:100%; padding:12px; margin:10px 0;">
      <button id="submitWithdrawBtn" style="width:100%; padding:15px; background:#28a745; color:white; border:none; border-radius:8px; font-size:16px;">Submit Withdrawal Request</button>
    </div>

    <div class="panel">
      <h2>Transaction History</h2>
      <div id="txHistory"></div>
    </div>
  </div>

  <script src="js/wallet.js"></script>
</body>
</html>
