<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zenith Markets — Wallet</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-icon"><svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M3 17L9 11L13 15L21 6"/></svg></span><span class="brand-name">ZENITH MARKETS</span></div>
      <div class="topbar-right">
        <span id="usernamePill" class="username-pill"></span>
        <a class="ghost-btn" href="index.html">Aviator</a>
        <a class="ghost-btn" href="trade.html">Trade</a>
        <a id="adminLink" class="ghost-btn section-hidden" href="admin.html">Admin</a>
        <button id="logoutBtn" class="ghost-btn">Log out</button>
      </div>
    </header>

    <div class="panel">
      <div class="wallet-summary">
        <span>Balance</span>
        <span id="walletBalance" class="wallet-balance-value">0.00</span>
      </div>
    </div>

    <div class="panel payment-box">
      <h2>Add Funds</h2>
      <p class="info-box">
        Real-money top-ups aren't wired up yet — this is a placeholder for a future payment
        integration. For now, ask an admin to credit your account from the Admin panel.
      </p>
    </div>

    <div class="panel payment-box">
      <h2>Request Withdrawal</h2>
      <div class="field">
        <label>Amount</label>
        <input type="number" id="withdrawAmount" min="1" step="1" value="100" />
      </div>
      <div class="field">
        <label>Payout destination</label>
        <input type="text" id="withdrawDestination" placeholder="Bank / UPI / wallet reference" />
      </div>
      <button id="submitWithdrawBtn" class="primary-btn" disabled>Withdrawals not yet available</button>
    </div>

    <div class="panel">
      <h2>Transaction History</h2>
      <div id="txHistory"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/wallet.js"></script>
</body>
</html>
